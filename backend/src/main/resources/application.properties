# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Application Uploads Directory
app.upload.dir=uploads/resumes

# Security / JWT Configuration
# Secret key must be a base64 or hex string of at least 256 bits (32 bytes)
jwt.secret=${JWT_SECRET}
# 15 minutes (in milliseconds)
jwt.expiration=900000
# 7 days (in milliseconds)
jwt.refresh-expiration=604800000

# OpenAI API Configuration (Legacy/Unused)
openai.api.key=${OPENAI_API_KEY}

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY}

# Google OAuth2 client registration for Gmail Readonly access
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=https://www.googleapis.com/auth/gmail.readonly
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

# Encryption key for storing Gmail tokens securely
gmail.token.encryption.key=${GMAIL_TOKEN_ENCRYPTION_KEY}


